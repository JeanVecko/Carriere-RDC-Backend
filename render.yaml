databases:
  - name: carrieres-rdc-db
    databaseName: carrieres_rdc
    plan: free

services:
  - type: web
    name: carrieres-rdc-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carrieres-rdc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: http://localhost:3000
        # A remplacer par l'URL Vercel une fois le frontend deploye,
        # ex: https://carrieres-rdc.vercel.app
